server:
  port: 8006

spring:
  application:
    name: train-task
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:train-task.yaml
  cloud:
    nacos:
      # 主机名经 hosts 解析（见 deploy/hosts.example），配置禁止写死 IP/localhost
      server-addr: remotelist:8848
      # Nacos 已开鉴权：凭证由启动环境注入，禁止写默认值（取值见 deploy/README.md）
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      config:
        file-extension: yaml
  # Quartz 任务表 JDBC 持久化：集群 instanceId=AUTO 各实例独立；
  # 数据源与线程池/误触发阈值调优 → Nacos（dataId=train-task.yaml）
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO

# 车次生成天数/日志级别 → 同在 Nacos（落地文件 deploy/nacos/configs/train-task.yaml）
