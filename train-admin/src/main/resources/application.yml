server:
  port: 8002

spring:
  application:
    name: train-admin
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:train-admin.yaml
  cloud:
    nacos:
      # 主机名经 hosts 解析到本机（见 deploy/hosts.example），配置禁止写死 IP/localhost
      server-addr: remotelist:8848
      # Nacos 已开鉴权：凭证由启动环境注入，禁止写默认值（取值见 deploy/README.md）
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      config:
        file-extension: yaml

mybatis-plus:
  # 自定义 SQL 的 mapper.xml 位置（通用 CRUD 仍由 MP BaseMapper 提供）
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
