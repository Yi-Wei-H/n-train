<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <title>铁旅通票务系统 · 管理端</title>
    <script>
      // 在样式加载前确定主题，避免刷新时先亮后暗
      (function () {
        var mode = 'auto'
        try {
          var saved = localStorage.getItem('ntrain-admin-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'auto') mode = saved
        } catch (e) { /* 隐私模式下忽略 */ }
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
