name: ntrain

x-logging: &logging
  options:
    max-size: "50m"
    max-file: "3"

networks:
  ntrain-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: ntrain-mysql
    command:
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --performance-schema=OFF
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
    mem_limit: 1024m
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ntrain-mysql-data:/var/lib/mysql
    networks:
      - ntrain-net
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ntrain-pg
    command: postgres -c shared_buffers=256MB -c maintenance_work_mem=128MB -c work_mem=16MB
    mem_limit: 1024m
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ntrain_agent
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ntrain-pg-data:/var/lib/postgresql/data
    networks:
      - ntrain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ntrain_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ntrain-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 192mb --maxmemory-policy allkeys-lru --appendonly yes
    mem_limit: 256m
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ntrain-redis-data:/data
    networks:
      - ntrain-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: ntrain-rocketmq-namesrv
    command: sh mqnamesrv
    mem_limit: 384m
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: -Xms256m -Xmx256m
    ports:
      - "9876:9876"
    networks:
      - ntrain-net
    logging: *logging
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: ntrain-rocketmq-broker
    command: sh mqbroker -n ntrain-rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    mem_limit: 1280m
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - ntrain-rocketmq-store:/home/rocketmq/store
      - ntrain-rocketmq-logs:/home/rocketmq/logs
    networks:
      - ntrain-net
    depends_on:
      - rocketmq-namesrv
    logging: *logging
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: ntrain-rocketmq-dashboard
    mem_limit: 512m
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx256m -Drocketmq.namesrv.addr=ntrain-rocketmq-namesrv:9876
    ports:
      - "8081:8080"
    networks:
      - ntrain-net
    depends_on:
      - rocketmq-namesrv
    logging: *logging
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: ntrain-nacos
    mem_limit: 1536m
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMSN: 256m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ntrain-nacos-data:/home/nacos/data
      - ntrain-nacos-logs:/home/nacos/logs
    networks:
      - ntrain-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: ntrain-sentinel
    mem_limit: 320m
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8858"
      JAVA_OPTS: -Xms192m -Xmx192m -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=${SENTINEL_PASSWORD}
    ports:
      - "8858:8858"
    networks:
      - ntrain-net
    logging: *logging
    restart: unless-stopped

volumes:
  ntrain-mysql-data:
  ntrain-pg-data:
  ntrain-rocketmq-store:
  ntrain-rocketmq-logs:
  ntrain-redis-data:
  ntrain-nacos-data:
  ntrain-nacos-logs:
