# =====================================================================
# Nacos 配置中心：train-task 的业务配置（dataId=train-task.yaml）
# =====================================================================

spring:
  datasource:
    url: jdbc:mysql://remotelist:3306/ntrain_task?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  quartz:
    properties:
      # 线程池大小 / 误触发阈值（misfire 一分钟）
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.misfireThreshold: 60000

ntrain:
  crypto:
    aes-key: ${NTRAIN_AES_KEY}
  task:
    # 每日车次生成：每天生成未来第 N 天（滚动覆盖，幂等）
    generate-days: 15

logging:
  level:
    com.weiyi.task: info
